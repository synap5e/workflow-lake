[project]
name = "comfy-workflow-lake"
version = "0.1.0"
description = "Crawler and ingest for the ComfyUI workflow data lake"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "psycopg[binary]>=3.2",
]

[project.optional-dependencies]
# Native GCS (dedicated SA key). The default backend on medina.
gcs = ["google-cloud-storage>=2.18"]
# S3, and the GCS S3-compat fallback if an org policy forbids SA keys.
s3 = ["boto3>=1.34"]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
lake = "pipeline.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lake", "pipeline"]

[tool.pytest.ini_options]
pythonpath = [".", "tests"]
testpaths = ["tests"]
